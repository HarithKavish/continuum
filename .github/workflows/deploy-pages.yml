name: Deploy Pages

# Publication happens here, in the repository -- not in a platform setting
# (standards/DEPLOYMENT.md). The Pages build type must be 'workflow'; the custom domain
# continuum.harithkavish.com is set on the Pages site and served through Cloudflare DNS.
#
# Continuum is a static build with no server: the artifact is HTML, JS, CSS, Cesium's
# static assets and the EGM96 geoid grid. Every data request is made by the reader's
# browser directly to the providers in docs/DATA_SOURCES.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one part-way through.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      # Any unknown path serves the app rather than GitHub's 404 page.
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
